<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nhật ký công việc</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f7a6b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nhật ký">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f4;--card:#fff;--ink:#1c2a2e;--mute:#66777c;--line:#dbe3e2;--acc:#1f7a6b;--acc-t:#dcefeb;--warn:#b7791f;--warn-t:#faecd2;--bad:#b4402f;--bad-t:#f8dfda;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b1d;--card:#1d272a;--ink:#e6eeee;--mute:#8fa2a6;--line:#2c393c;--acc:#4fc0ac;--acc-t:#1c3a36;--warn:#e0aa4a;--warn-t:#3a2f17;--bad:#e5806f;--bad-t:#3d1f1a}}
:root[data-theme="dark"]{--bg:#141b1d;--card:#1d272a;--ink:#e6eeee;--mute:#8fa2a6;--line:#2c393c;--acc:#4fc0ac;--acc-t:#1c3a36;--warn:#e0aa4a;--warn-t:#3a2f17;--bad:#e5806f;--bad-t:#3d1f1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:8px 0 2px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px}
.stats{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.stat{flex:1;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;padding:10px 14px;font:inherit;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--acc);font-weight:500}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;display:grid;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{resize:vertical;min-height:64px}
.btn{font:inherit;font-weight:500;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:9px 16px;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0d1a18}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0d1a18}}
.btn.ghost,:root[data-theme="dark"] .btn.ghost,:root[data-theme="light"] .btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ghost{background:none;color:var(--ink)}}
.btn.danger,:root[data-theme="dark"] .btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.period{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.period .lbl{flex:1;text-align:center;font-weight:500;min-width:140px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs .im{position:relative}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.thumbs .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;line-height:1;font-size:14px;padding:0}
.file{font-size:13px;color:var(--mute)}
.compose{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.compose:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-t)}
.compose input,.compose textarea{border:0;border-radius:0;background:transparent;width:100%}
.compose input:focus-visible,.compose textarea:focus-visible{outline:none}
.compose input{font-weight:700;font-size:17px;padding:14px 14px 4px}
.compose textarea{padding:6px 14px 14px;min-height:130px;resize:vertical;line-height:1.55}
.tb{display:flex;gap:4px;padding:6px 10px;border-top:1px solid var(--line)}
.tb button{border:1px solid transparent;background:none;color:var(--mute);border-radius:6px;width:30px;height:28px;cursor:pointer;font:inherit;font-size:15px;padding:0}
.tb button:hover{background:var(--line)}
.tb button.on{background:var(--acc-t);color:var(--acc)}
.compose .rte{padding:6px 14px 12px;min-height:130px;outline:none;line-height:1.55;overflow-wrap:anywhere;color:var(--ink)}
.rte:empty:before{content:attr(data-ph);color:var(--mute);pointer-events:none}
.rt{margin:4px 0 0;overflow-wrap:anywhere}
.rt div{min-height:1.5em}
.badge.hot{background:var(--warn-t);color:var(--warn);font-weight:500}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--card);color:var(--ink);border-radius:12px;padding:18px;max-width:420px;width:100%;display:grid;gap:12px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end}
.dlg textarea{min-height:140px;font-size:12px}
.ov img.big{max-width:100%;max-height:90vh;border-radius:8px}
.msg{color:var(--bad);font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters input{flex:1;min-width:120px;width:auto;padding:6px 12px;border-radius:99px;font-size:13px}
.task{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mute);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.task.todo{border-left-color:var(--bad)}
.task.plan{border-left-color:var(--warn)}
.task.done{border-left-color:var(--acc)}
.task.done .t{text-decoration:line-through;color:var(--mute)}
.check{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--acc);cursor:pointer}
.body{flex:1;min-width:0}
.t{font-weight:500;overflow-wrap:anywhere}
.n{color:var(--mute);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12.5px}
.badge{border-radius:99px;padding:2px 9px;background:var(--line);color:var(--ink)}
.badge.late{background:var(--bad-t);color:var(--bad)}
.badge.today{background:var(--warn-t);color:var(--warn)}
.meta select{width:auto;padding:3px 6px;font-size:12.5px}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:12.5px;cursor:pointer;padding:2px 4px;text-decoration:underline}
.empty{text-align:center;color:var(--mute);padding:36px 12px;border:1px dashed var(--line);border-radius:10px}
.log{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.log time{font-size:12.5px;color:var(--mute)}
.log p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="ov" id="auth" hidden><div class="dlg" role="dialog" aria-modal="true" style="max-width:360px">
  <b style="font-size:18px">Đăng nhập để xem nhật ký</b>
  <input id="aMail" type="email" placeholder="Email" autocomplete="username">
  <input id="aPass" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" autocomplete="current-password">
  <div class="msg" id="aMsg"></div>
  <div class="acts" style="flex-wrap:wrap"><button class="btn ghost" id="aReset">Quên mật khẩu</button><button class="btn ghost" id="aReg">Tạo tài khoản</button><button class="btn" id="aIn">Đăng nhập</button></div>
</div></div>
<main id="app">
  <div class="top">
    <div>
      <h1>Nhật ký công việc</h1>
      <p class="sub" id="today"></p>
      <p class="sub" id="sync" style="margin-top:-14px;font-size:13px">Đang lưu trên thiết bị này</p>
    </div>
    <div class="row" style="flex:none;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn ghost" id="logout" hidden style="min-width:0">Đăng xuất</button><button class="btn ghost" id="backup" style="min-width:0">Sao lưu</button><button class="btn ghost" id="theme" style="min-width:0" aria-label="Đổi giao diện sáng/tối">Sáng/Tối</button></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="tasks" aria-selected="true">Công việc</button>
    <button class="tab" role="tab" data-view="logs" aria-selected="false">Nhật ký</button>
  </div>

  <div class="period" id="period">
    <button class="chip" data-p="all" aria-pressed="true">Tất cả</button>
    <button class="chip" data-p="week" aria-pressed="false">Theo tuần</button>
    <button class="chip" data-p="month" aria-pressed="false">Theo tháng</button>
    <span id="pnav" hidden style="display:none;flex:1;align-items:center;gap:6px;min-width:220px"><button class="chip" data-nav="-1" aria-label="Trước">‹</button><span class="lbl" id="plbl"></span><button class="chip" data-nav="1" aria-label="Sau">›</button></span>
  </div>

  <section id="v-tasks">
    <div class="form" id="taskForm">
      <input id="tTitle" placeholder="Việc cần làm là gì?" maxlength="200">
      <textarea id="tNote" placeholder="Ghi chú thêm (không bắt buộc)"></textarea>
      <div class="row">
        <select id="tStatus" aria-label="Trạng thái">
          <option value="todo">Chưa làm</option>
          <option value="plan">Cần sắp xếp</option>
          <option value="done">Đã hoàn thành</option>
        </select>
        <input id="tDue" type="date" aria-label="Hạn hoàn thành">
      </div>
      <label class="file"><input type="checkbox" id="tHot" style="width:auto"> Ưu tiên cao</label>
      <div><label class="file">Thêm ảnh (tối đa 5): <input type="file" id="tFile" accept="image/*" multiple style="border:0;padding:4px 0;background:none"></label><div class="thumbs" id="tThumbs"></div></div>
      <div class="row">
        <button class="btn" id="tSave">Thêm việc</button>
        <button class="btn ghost" id="tCancel" hidden>Hủy sửa</button>
      </div>
    </div>
    <div class="filters">
      <button class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button class="chip" data-f="todo" aria-pressed="false">Chưa làm</button>
      <button class="chip" data-f="plan" aria-pressed="false">Cần sắp xếp</button>
      <button class="chip" data-f="done" aria-pressed="false">Đã xong</button>
      <input id="q" type="search" placeholder="Tìm việc..." aria-label="Tìm việc">
    </div>
    <div id="list"></div>
  </section>

  <section id="v-logs" hidden>
    <div class="form">
      <div class="compose">
        <input id="lTitle" placeholder="Tiêu đề" maxlength="150" aria-label="Tiêu đề nhật ký">
        <div class="rte" id="lText" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Nội dung nhật ký" data-ph="Hôm nay bạn đã làm gì, gặp vấn đề gì, cần nhớ gì?"></div>
        <div class="tb"><button type="button" data-cmd="bold" title="In đậm (Ctrl+B)" aria-label="In đậm"><b>B</b></button><button type="button" data-cmd="italic" title="In nghiêng (Ctrl+I)" aria-label="In nghiêng"><i>I</i></button><button type="button" data-cmd="underline" title="Gạch chân (Ctrl+U)" aria-label="Gạch chân"><u>U</u></button></div>
      </div>
      <div><label class="file">Thêm ảnh: <input type="file" id="lFile" accept="image/*" multiple style="border:0;padding:4px 0;background:none"></label><div class="thumbs" id="lThumbs"></div></div>
      <div class="row"><input id="lDate" type="date" aria-label="Ngày"><button class="btn" id="lSave">Lưu nhật ký</button></div>
    </div>
    <div id="logList"></div>
  </section>
</main>

<script src="firebase-config.js"></script>
<script>
(function(){
  var DK="nhatky-draft-v1",DR={};
  try{DR=JSON.parse(localStorage.getItem(DK)||"{}")||{}}catch(e){DR={}}
  var DT={},sentD={},firstD=true;
  function persistDR(){try{localStorage.setItem(DK,JSON.stringify(DR))}catch(e){}}
  function putDraft(k,v){DR[k]=v;persistDR();pushDraft(k)}
  function dropDraft(k){if(k in DR){delete DR[k];persistDR();pushDraft(k)}}
  function pushDraft(k){
    if(!cloud||!uidv)return;
    clearTimeout(DT[k]);
    DT[k]=setTimeout(function(){
      delete DT[k];
      var ref=F.doc(DBH,"users",uidv,"drafts",k);
      if(DR[k]===undefined){delete sentD[k];F.deleteDoc(ref).catch(function(){})}
      else{sentD[k]=JSON.stringify(DR[k]);F.setDoc(ref,{key:k,v:DR[k],t:Date.now()}).catch(function(){})}
    },700);
  }
  function draftSnap(snap){
    var remote={};
    snap.forEach(function(d){var o=d.data();remote[o.key]=o.v});
    if(firstD){
      firstD=false;
      Object.keys(DR).forEach(function(k){if(!(k in remote))pushDraft(k)});
      Object.keys(remote).forEach(function(k){DR[k]=remote[k];sentD[k]=JSON.stringify(remote[k])});
    }else{
      Object.keys(remote).forEach(function(k){
        var r=JSON.stringify(remote[k]);
        if(DT[k]||(DR[k]!==undefined&&JSON.stringify(DR[k])!==sentD[k]))return;
        DR[k]=remote[k];sentD[k]=r;
      });
      Object.keys(DR).forEach(function(k){
        if(!(k in remote)&&!DT[k]&&JSON.stringify(DR[k])===sentD[k])delete DR[k];
      });
    }
    persistDR();renderTasks();renderLogs();applyNewDrafts();
  }
  function applyNewDrafts(){
    var d1=DR.newtask,d2=DR.newlog,fa=document.activeElement;
    if(d1&&!$("taskForm").contains(fa)&&!$("tTitle").value&&!$("tNote").value){
      $("tTitle").value=d1.title||"";$("tNote").value=d1.note||"";$("tStatus").value=d1.status||"todo";$("tDue").value=d1.due||"";$("tHot").checked=!!d1.hot;
    }
    if(d2&&fa!==$("lTitle")&&fa!==$("lText")&&!$("lTitle").value&&!$("lText").value){
      $("lTitle").value=d2.title||"";$("lText").value=d2.rich?d2.text:plainToHtml(d2.text);if(d2.date)$("lDate").value=d2.date;
    }
  }
  var KEY="nhatky-cv-v1",MAXIMG=150000,MAXTOTAL=700000;
  var S={tasks:[],logs:[],f:"all",q:"",edit:null,mode:"all",off:0,timgs:[],limgs:[]};
  var LABEL={todo:"Chưa làm",plan:"Cần sắp xếp",done:"Đã hoàn thành"};
  var $=function(id){return document.getElementById(id)};

  function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(d){S.tasks=d.tasks||[];S.logs=d.logs||[]}}catch(e){}}
  function save(){if(cloud){push();return true}try{localStorage.setItem(KEY,JSON.stringify({tasks:S.tasks,logs:S.logs}));return true}catch(e){
    dialog('<p class="msg">Không lưu được: bộ nhớ trình duyệt đã đầy. Hãy xóa bớt ảnh hoặc sao lưu rồi xóa việc cũ.</p>',[["Đóng"]]);return false}}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function iso(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
  function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
  var TODAY=iso(new Date());
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  var TB='<div class="tb"><button type="button" data-cmd="bold" title="In đậm (Ctrl+B)" aria-label="In đậm"><b>B</b></button><button type="button" data-cmd="italic" title="In nghiêng (Ctrl+I)" aria-label="In nghiêng"><i>I</i></button><button type="button" data-cmd="underline" title="Gạch chân (Ctrl+U)" aria-label="Gạch chân"><u>U</u></button></div>';
  function clean(html){
    var t=document.createElement("template");t.innerHTML=html;
    (function walk(n){
      Array.prototype.slice.call(n.childNodes).forEach(function(c){
        if(c.nodeType===3)return;
        if(c.nodeType!==1){c.remove();return}
        var tag=c.tagName.toLowerCase();
        if(tag==="script"||tag==="style"){c.remove();return}
        walk(c);
        tag={strong:"b",em:"i"}[tag]||tag;
        if(["b","i","u","br","div","p"].indexOf(tag)<0){c.replaceWith.apply(c,Array.prototype.slice.call(c.childNodes));return}
        if(tag!==c.tagName.toLowerCase()){var r=document.createElement(tag);while(c.firstChild)r.appendChild(c.firstChild);c.replaceWith(r);c=r}
        Array.prototype.slice.call(c.attributes).forEach(function(a){c.removeAttribute(a.name)});
      });
    })(t.content);
    return t.innerHTML;
  }
  function plainToHtml(x){return esc(x||"").replace(/\n/g,"<br>")}
  function makeRT(el){
    Object.defineProperty(el,"value",{configurable:true,
      get:function(){return el.textContent.trim()===""?"":clean(el.innerHTML)},
      set:function(v){el.innerHTML=v?clean(v):""}});
  }
  function syncTb(){
    var fa=document.activeElement;if(!fa||!fa.classList||!fa.classList.contains("rte"))return;
    var c=fa.closest(".compose");if(!c)return;
    c.querySelectorAll(".tb button").forEach(function(b){var on=false;try{on=document.queryCommandState(b.dataset.cmd)}catch(e){}b.classList.toggle("on",on)});
  }
  document.addEventListener("mousedown",function(e){if(e.target.closest&&e.target.closest(".tb"))e.preventDefault()});
  document.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest(".tb button");if(!b)return;
    var ed=b.closest(".compose").querySelector(".rte");if(document.activeElement!==ed)ed.focus();
    document.execCommand(b.dataset.cmd);ed.dispatchEvent(new Event("input",{bubbles:true}));syncTb();
  });
  document.addEventListener("selectionchange",syncTb);
  document.addEventListener("paste",function(e){
    if(!(e.target.closest&&e.target.closest(".rte")))return;
    e.preventDefault();
    document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text/plain"));
  });
  document.addEventListener("input",function(e){
    var el=e.target;
    if(el.classList&&el.classList.contains("rte")&&(el.innerHTML==="<br>"||el.innerHTML==="<div><br></div>"))el.innerHTML="";
  });
  function srcOf(x){return x.indexOf("data:")===0?x:"/_blob/"+x}

  /* Đồng bộ qua Firebase (đăng nhập bằng email, dữ liệu riêng từng tài khoản) */
  var CFG=window.FIREBASE_CONFIG||{apiKey:"DÁN_apiKey"};
  var cloud=false,F=null,AUTH=null,DBH=null,uidv=null,timer=null,dirty=false,unsubs=[],sent={tasks:{},logs:{}},first={tasks:true,logs:true};
  var app=$("app");
  function configured(){return CFG.apiKey&&CFG.apiKey.indexOf("DÁN")!==0}
  function setSync(t){$("sync").textContent=t}
  function push(){
    if(!cloud||!uidv)return;clearTimeout(timer);dirty=true;
    timer=setTimeout(function(){
      ["tasks","logs"].forEach(function(k){
        var cur={};S[k].forEach(function(o){cur[o.id]=JSON.stringify(o)});
        Object.keys(cur).forEach(function(id){
          if(sent[k][id]===cur[id])return;
          if(cur[id].length>900000){dialog('<div>Mục này quá nặng để lưu (nhiều ảnh lớn). Hãy bớt ảnh.</div>',[["Đóng"]]);return}
          sent[k][id]=cur[id];
          F.setDoc(F.doc(DBH,"users",uidv,k,id),JSON.parse(cur[id])).catch(function(e){delete sent[k][id];fail(e)});
        });
        Object.keys(sent[k]).forEach(function(id){
          if(id in cur)return;
          delete sent[k][id];
          F.deleteDoc(F.doc(DBH,"users",uidv,k,id)).catch(fail);
        });
      });
      dirty=false;setSync("Đã đồng bộ giữa các thiết bị");
    },300);
  }
  function fail(e){

  /* Ảnh: thu nhỏ để tiết kiệm bộ nhớ */
  function readImgs(files,arr,after){
    var list=Array.prototype.slice.call(files),n=list.length;
    if(!n)return;
    list.forEach(function(f){
      var r=new FileReader();
      r.onload=function(){
        var im=new Image();
        im.onload=function(){
          var u="";
          for(var a=0;a<3;a++){
            var k=Math.min(1,[900,700,520][a]/Math.max(im.width,im.height)),c=document.createElement("canvas");
            c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
            c.getContext("2d").drawImage(im,0,0,c.width,c.height);
            u=c.toDataURL("image/jpeg",0.6);if(u.length<=MAXIMG)break;
            u=c.toDataURL("image/jpeg",0.4);if(u.length<=MAXIMG)break;
          }
          arr.push(u);if(--n===0)after();
        };
        im.onerror=function(){if(--n===0)after()};
        im.src=r.result;
      };
      r.readAsDataURL(f);
    });
  }
  function fit(arr){
    var t=0,out=0;
    for(var i=0;i<arr.length;i++){t+=arr[i].length;if(t>MAXTOTAL){out=arr.length-i;arr.length=i;break}}
    if(out)dialog('<div>Mỗi mục chỉ lưu được một lượng ảnh nhất định. Đã bỏ '+out+' ảnh vượt mức, hãy bớt ảnh hoặc chọn ảnh nhỏ hơn.</div>',[["Đóng"]]);
  }

      b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);

  function renderTasks(){
    var q=S.q.trim().toLowerCase(),r=range();
    var order={todo:0,plan:1,done:2};
    var arr=S.tasks.filter(function(t){
      return (S.f==="all"||t.status===S.f)&&inRange(r,t.due||iso(new Date(t.created)))&&(!q||(t.title+" "+t.note).toLowerCase().indexOf(q)>-1)
    }).sort(function(a,b){
      if(order[a.status]!==order[b.status])return order[a.status]-order[b.status];
      if(!!a.hot!==!!b.hot)return a.hot?-1:1;
      if(a.due&&b.due)return a.due<b.due?-1:1;
      if(a.due)return -1;if(b.due)return 1;
      return b.created-a.created;
    });
    if(!arr.length){
      $("list").innerHTML='<div class="empty">'+(S.tasks.length?'Không có việc nào trong bộ lọc này.':'Chưa có việc nào. Nhập việc đầu tiên ở khung phía trên.')+'</div>';

    var id=card.dataset.id,t=S.tasks.find(function(x){return x.id===id});if(!t)return;
    var act=e.target.dataset.act;
    if(act==="del")confirmDel('Bạn có chắc muốn xóa việc <b>'+esc(t.title)+'</b>?',function(){S.tasks=S.tasks.filter(function(x){return x.id!==id});save();renderAll()});
    else if(act==="edit")openEdit(t);
  };
  $("list").onchange=function(e){
    var card=e.target.closest(".task");if(!card)return;
    var t=S.tasks.find(function(x){return x.id===card.dataset.id});if(!t)return;
    if(e.target.classList.contains("check"))t.status=e.target.checked?"done":"todo";
    else if(e.target.classList.contains("st"))t.status=e.target.value;
    else return;
    save();renderAll();
  };

  document.querySelectorAll(".chip[data-f]").forEach(function(b){
    b.onclick=function(){
      S.f=b.dataset.f;
      document.querySelectorAll(".chip[data-f]").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
      renderTasks();
    };
  });
  $("period").onclick=function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.dataset.p){S.mode=b.dataset.p;S.off=0}
    else if(b.dataset.nav)S.off+=+b.dataset.nav;
    else return;
    renderAll();
  };
  $("q").oninput=function(){S.q=this.value;renderTasks()};

  document.querySelectorAll(".tab").forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected",x===b)});
      $("v-tasks").hidden=b.dataset.view!=="tasks";
      $("v-logs").hidden=b.dataset.view!=="logs";
    };
  });

  $("lSave").onclick=function(){
    var text=$("lText").value.trim(),title=$("lTitle").value.trim();
    if(!text&&!title&&!S.limgs.length){$("lTitle").focus();return}
    S.logs.push({id:uid(),created:Date.now(),date:$("lDate").value||TODAY,title:title,text:text,rich:true,imgs:S.limgs.slice()});
    dropDraft("newlog");$("lTitle").value="";$("lText").value="";S.limgs=[];$("lThumbs").innerHTML="";$("lFile").value="";save();renderLogs();
  };
  $("logList").onclick=function(e){
    if(e.target.dataset.z){zoom(e.target.src);return}
    var lg=e.target.closest(".log");
    if(e.target.dataset.act==="editlog"&&lg){var L=S.logs.find(function(x){return x.id===lg.dataset.id});if(L)openLogEdit(L);return}
    if(e.target.dataset.act!=="dellog")return;
    var id=lg.dataset.id;
    confirmDel("Bạn có chắc muốn xóa nhật ký này?",function(){S.logs=S.logs.filter(function(x){return x.id!==id});save();renderLogs()});
  };

  /* Sao lưu / khôi phục bằng cách sao chép văn bản */
  $("backup").onclick=function(){
    var withImgs=JSON.stringify({tasks:S.tasks,logs:S.logs});
    var o=dialog('<b>Sao lưu &amp; khôi phục</b><div class="file">Sao chép đoạn văn bản dưới đây và lưu vào ghi chú/email của bạn. Để khôi phục, dán lại nội dung đã sao lưu vào ô này rồi bấm Khôi phục (sẽ thay thế dữ liệu hiện tại).</div><textarea id="bk"></textarea><div class="msg" id="bkm"></div>',
      [["Đóng"],["Sao chép","ghost"],["Khôi phục","danger"]],function(i,o){
        var ta=o.querySelector("#bk");
        if(i===1){ta.select();try{document.execCommand("copy");o.querySelector("#bkm").style.color="var(--acc)";o.querySelector("#bkm").textContent="Đã sao chép."}catch(e){}return true}
        if(i===2){try{var d=JSON.parse(ta.value);if(!Array.isArray(d.tasks)||!Array.isArray(d.logs))throw 0;S.tasks=d.tasks;S.logs=d.logs;save();renderAll();return false}catch(e){o.querySelector("#bkm").style.color="var(--bad)";o.querySelector("#bkm").textContent="Nội dung không hợp lệ.";return true}}
      });
    o.querySelector("#bk").value=withImgs;
  };

  $("theme").onclick=function(){
    var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    r.dataset.theme=dark?"light":"dark";
  };

  var days=["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];
  $("today").textContent=days[new Date().getDay()]+", "+fmt(TODAY);
  $("lDate").value=TODAY;
  function ntDraft(){
    var v={title:$("tTitle").value,note:$("tNote").value,status:$("tStatus").value,due:$("tDue").value,hot:$("tHot").checked};
    if(!v.title&&!v.note&&!v.due&&!v.hot&&v.status==="todo")dropDraft("newtask");else putDraft("newtask",v);
  }
  $("taskForm").addEventListener("input",ntDraft);$("taskForm").addEventListener("change",ntDraft);
  function nlDraft(){
    var v={title:$("lTitle").value,text:$("lText").value,date:$("lDate").value,rich:true};
    if(!v.title&&!v.text)dropDraft("newlog");else putDraft("newlog",v);
  }
  ["lTitle","lText","lDate"].forEach(function(i){$(i).addEventListener("input",nlDraft)});
  if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});
  makeRT($("lText"));
  try{document.execCommand("defaultParagraphSeparator",false,"div")}catch(e){}
  applyNewDrafts();
  load();renderAll();connect();
})();
</script>
</body>
</html>
