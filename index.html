<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script>try{var _t=localStorage.getItem("nhatky-theme");if(_t==="dark"||_t==="light")document.documentElement.dataset.theme=_t}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>if(/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1))document.querySelector('meta[name=viewport]').setAttribute("content","width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1");</script>
<title>Nhật ký công việc</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f7a6b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nhật ký">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f4;--card:#fff;--ink:#1c2a2e;--mute:#66777c;--line:#dbe3e2;--acc:#1f7a6b;--acc-t:#dcefeb;--warn:#b7791f;--warn-t:#faecd2;--bad:#b4402f;--bad-t:#f8dfda;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
:root[data-theme="dark"]{--bg:#141b1d;--card:#1d272a;--ink:#e6eeee;--mute:#8fa2a6;--line:#2c393c;--acc:#4fc0ac;--acc-t:#1c3a36;--warn:#e0aa4a;--warn-t:#3a2f17;--bad:#e5806f;--bad-t:#3d1f1a}
html{overflow-y:scroll;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:8px 0 2px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px}
.stats{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.stat{flex:1;min-width:96px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;padding:10px 14px;font:inherit;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--acc);font-weight:500}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;display:grid;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{resize:vertical;min-height:64px}
.btn{font:inherit;font-weight:500;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:9px 16px;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0d1a18}
.btn.ghost,:root[data-theme="dark"] .btn.ghost,:root[data-theme="light"] .btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.danger,:root[data-theme="dark"] .btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.period{min-height:34px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.period .lbl{flex:1;text-align:center;font-weight:500;min-width:140px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs .im{position:relative}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.thumbs .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;line-height:1;font-size:14px;padding:0}
.file{font-size:13px;color:var(--mute)}
.compose{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.compose:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-t)}
.compose input,.compose textarea{border:0;border-radius:0;background:transparent;width:100%}
.compose input:focus-visible,.compose textarea:focus-visible{outline:none}
.compose input{font-weight:700;font-size:17px;padding:14px 14px 4px}
.compose textarea{padding:6px 14px 14px;min-height:130px;resize:vertical;line-height:1.55}
.tb{display:flex;gap:4px;padding:6px 10px;border-top:1px solid var(--line)}
.tb button{border:1px solid transparent;background:none;color:var(--mute);border-radius:6px;width:30px;height:28px;cursor:pointer;font:inherit;font-size:15px;padding:0}
.tb button:hover{background:var(--line)}
.tb button.on{background:var(--acc-t);color:var(--acc)}
.compose .rte{white-space:pre-wrap;padding:6px 14px 12px;min-height:130px;outline:none;line-height:1.55;overflow-wrap:anywhere;color:var(--ink)}
.rte:empty:before{content:attr(data-ph);color:var(--mute);pointer-events:none}
.rt{margin:4px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.rt div{min-height:1.5em}
.stamp{margin-top:8px;font-size:12px;color:var(--mute)}
.row label.file{display:grid;gap:4px}
.gh{font-weight:700;margin:20px 0 8px;display:flex;gap:8px;align-items:baseline}
.gh small{color:var(--mute);font-weight:400;font-size:13px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.goal.done{opacity:.72}.goal.paused{border-style:dashed}
.goal .why{color:var(--mute);font-style:italic;margin:6px 0 0;border-left:3px solid var(--acc-t);padding-left:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.ms-item{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.ms-item input{width:18px;height:18px;margin-top:2px;accent-color:var(--acc);flex:none}
.ms-item.done span{text-decoration:line-through;color:var(--mute)}
.rev{background:var(--warn-t);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px;margin-top:10px}
.ms{display:flex;gap:6px;margin-bottom:6px}.ms input{flex:1}
.row>.hbtn{flex:none;min-width:0;height:42px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;line-height:1}
[data-clamp]{line-height:1.5}
.fade{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 1.4em),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 1.4em),transparent)}
.more{display:block;margin-top:4px;color:var(--acc);text-decoration:none;font-weight:500;font-size:13px}
@media(max-width:600px){
  body{font-size:14px;line-height:1.45}
  main{padding:14px 12px 48px}
  h1{font-size:20px}
  .sub{font-size:13px;margin-bottom:14px}
  .stat{padding:8px 10px;min-width:80px}.stat b{font-size:18px}.stat span{font-size:12px}
  .tab{padding:9px 11px;font-size:14px}
  .chip{font-size:12px;padding:4px 10px}
  .btn{font-size:14px;padding:8px 14px}
  .t{font-size:14.5px}.n{font-size:13px}.meta{font-size:12px}
  .goal .t{font-size:15px!important}
  .compose input{font-size:15px;padding:12px 12px 4px}
  .compose .rte,.compose textarea{font-size:14px;padding:6px 12px 10px;min-height:110px}
  .form,.task,.goal,.log{padding:11px}
  .dlg{padding:15px}
  .dlg input,.dlg textarea,.dlg select,.form input,.form textarea,.form select{font-size:14px;padding:8px 10px}
  .form select,.dlg select,.goal select,.meta select{font-size:13px;padding:6px 10px;min-height:34px;border-radius:8px}
  input[type=date],input[type=time]{font-size:13px;min-height:36px}
  .row.dt input,.row.dt select{height:36px}
}

.row.dt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row.dt>*{min-width:0}
.row.dt input,.row.dt select{height:40px}
.tlist{position:fixed;z-index:80;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.28);overflow-y:auto;overscroll-behavior:contain;padding:4px;color:var(--ink)}
.ti{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.ti:hover,.ti.on{background:var(--acc-t);color:var(--acc)}
.ti.none{color:var(--mute)}
input[type=date],input[type=time]{min-width:0;max-width:100%;min-height:40px;-webkit-appearance:none;appearance:none;text-align:left}
html{overscroll-behavior-y:contain}
#ptr{position:fixed;left:0;right:0;top:0;height:0;display:flex;align-items:flex-start;justify-content:center;pointer-events:none;z-index:40;padding-top:env(safe-area-inset-top,0px)}
#ptr .pill{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:7px 16px;font-size:13px;line-height:1.3;min-width:176px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.18);transform:translateY(-60px);opacity:0;white-space:nowrap}
#ptr.snap .pill{transition:transform .2s,opacity .2s}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;display:flex;gap:14px;align-items:center;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:92vw}
.toast .link{color:var(--bg);font-weight:700;font-size:13px}
.stat.total{flex:1 1 100%}
.stat.total .bar{margin:8px 0 4px}
.dateline{display:flex;align-items:baseline;gap:6px;white-space:nowrap;min-width:0;min-height:1.5em}
.dateline #today{flex:none}
.syncmsg{font-size:12px;color:var(--warn);margin:-10px 0 14px;line-height:1.35}
.remind{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.remind button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 11px;cursor:pointer}
.remind .r-late{background:var(--bad-t);color:var(--bad);border-color:transparent;font-weight:500}
.remind .r-today{background:var(--warn-t);color:var(--warn);border-color:transparent;font-weight:500}
.remind .r-goal{background:var(--acc-t);color:var(--acc);border-color:transparent;font-weight:500}
.hdr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.hdr>div:first-child{min-width:0}
.hdr>.row{flex-wrap:nowrap!important;justify-content:flex-end}
.dateline{overflow:hidden}
.grip{flex:none;width:16px;align-self:center;height:22px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:radial-gradient(circle,var(--mute) 1.5px,transparent 1.8px) 0 0/8px 8px;opacity:.8}
.ms.drag{background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:8px;position:relative;z-index:2}
.ms.drag .grip{cursor:grabbing}
.log .t{font-weight:700;font-size:15.5px;margin-top:4px}
.log time small{font-size:inherit;opacity:.9}
.tbox{position:relative}
.tbox input{padding-right:30px;width:100%}
.tbox input.bad{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-t)}
.tchev{position:absolute;right:0;top:0;bottom:0;width:30px;border:0;background:none;color:var(--mute);cursor:pointer;padding:0}
.tchev::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translate(-50%,-70%) rotate(45deg)}
.terr{color:var(--bad);font-size:12px;line-height:1.3}
.dayh{font-size:12px;font-weight:700;color:var(--mute);margin:16px 2px 6px}
.dayh:first-child{margin-top:4px}
.lmeta{font-size:12.5px;color:var(--mute)}
.log .top .t{margin-top:0}
.badge.hot{background:var(--warn-t);color:var(--warn);font-weight:500}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--card);color:var(--ink);border-radius:12px;padding:18px;max-width:420px;width:100%;display:grid;gap:12px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end}
.dlg textarea{min-height:140px;font-size:12px}
.ov img.big{max-width:100%;max-height:90vh;border-radius:8px}
.msg{color:var(--bad);font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters input{flex:1;min-width:120px;width:auto;padding:6px 12px;border-radius:99px;font-size:13px}
.task{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mute);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.task.todo{border-left-color:var(--bad)}
.task.plan{border-left-color:var(--warn)}
.task.done{border-left-color:var(--acc)}
.task.done .t{text-decoration:line-through;color:var(--mute)}
.check{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--acc);cursor:pointer}
.body{flex:1;min-width:0}
.t{font-weight:500;overflow-wrap:anywhere}
.n{color:var(--mute);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12.5px}
.badge{border-radius:99px;padding:2px 9px;background:var(--line);color:var(--ink)}
.badge.late{background:var(--bad-t);color:var(--bad)}
.badge.today{background:var(--warn-t);color:var(--warn)}
.meta select{width:auto;padding:3px 6px;font-size:12.5px}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:12.5px;cursor:pointer;padding:2px 4px;text-decoration:underline}
.empty{text-align:center;color:var(--mute);padding:36px 12px;border:1px dashed var(--line);border-radius:10px}
.log{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.log time{font-size:12.5px;color:var(--mute)}
.log p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="ov" id="auth" hidden><div class="dlg" role="dialog" aria-modal="true" style="max-width:360px">
  <b style="font-size:18px">Đăng nhập để xem nhật ký</b>
  <input id="aMail" type="email" placeholder="Email" autocomplete="username">
  <input id="aPass" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" autocomplete="current-password">
  <label class="file" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="aKeep" style="width:auto"> Giữ đăng nhập trên thiết bị này</label>
  <div class="msg" id="aMsg"></div>
  <div class="acts" style="flex-wrap:wrap"><button class="btn ghost" id="aReset">Quên mật khẩu</button><button class="btn ghost" id="aReg">Tạo tài khoản</button><button class="btn" id="aIn">Đăng nhập</button></div>
</div></div>
<main id="app">
  <div class="hdr">
    <div>
      <h1>Nhật ký công việc</h1>
      <div class="sub dateline"><span id="today"></span></div>
      <div id="sync" class="syncmsg" role="status" hidden></div>
    </div>
    <div class="row" style="flex:none;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn ghost hbtn" id="acct" hidden aria-label="Tài khoản" title="Tài khoản" style="min-width:0;width:42px;height:42px;padding:0;border-radius:50%;font-weight:700;background:var(--acc-t);border-color:var(--acc);color:var(--acc)"></button><button class="btn ghost hbtn" id="backup" style="min-width:0">Sao lưu</button><button class="btn ghost hbtn" id="theme" style="min-width:0" aria-label="Đổi giao diện sáng/tối">Sáng/Tối</button></div>
  </div>

  <div class="remind" id="remind" hidden></div>
  <div class="stats" id="stats"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="tasks" aria-selected="true">Công việc</button>
    <button class="tab" role="tab" data-view="logs" aria-selected="false">Nhật ký</button>
    <button class="tab" role="tab" data-view="goals" aria-selected="false">Mục tiêu</button>
  </div>

  <div class="period" id="period">
    <button class="chip" data-p="all" aria-pressed="true">Tất cả</button>
    <button class="chip" data-p="week" aria-pressed="false">Theo tuần</button>
    <button class="chip" data-p="month" aria-pressed="false">Theo tháng</button>
    <button class="chip" data-p="year" aria-pressed="false">Theo năm</button>
    <span id="pnav" style="display:none;flex:1;align-items:center;gap:6px;min-width:220px"><button class="chip" data-nav="-1" aria-label="Trước">‹</button><span class="lbl" id="plbl"></span><button class="chip" data-nav="1" aria-label="Sau">›</button></span>
  </div>

  <div class="period" id="gfilter" hidden>
    <button class="chip" data-gf="all" aria-pressed="true">Tất cả</button>
    <button class="chip" data-gf="active" aria-pressed="false">Đang theo đuổi</button>
    <button class="chip" data-gf="paused" aria-pressed="false">Tạm dừng</button>
    <button class="chip" data-gf="done" aria-pressed="false">Đã đạt</button>
  </div>

  <section id="v-tasks">
    <div class="form" id="taskForm">
      <input id="tTitle" placeholder="Việc cần làm là gì?" maxlength="200">
      <textarea id="tNote" placeholder="Ghi chú thêm (không bắt buộc)"></textarea>
      <div class="row">
        <select id="tStatus" aria-label="Trạng thái">
          <option value="todo">Chưa làm</option>
          <option value="plan">Ưu tiên làm</option>
          <option value="done">Đã hoàn thành</option>
        </select>
        <select id="tGoal" aria-label="Mục tiêu liên quan"></select>
      </div>
      <div class="row dt">
        <label class="file">Hạn / ngày thực hiện<input id="tDue" type="date"></label>
        <label class="file">Giờ (không bắt buộc)<input id="tTime" type="text" inputmode="numeric" autocomplete="off" placeholder="HH:mm" aria-label="Giờ (nhập hoặc chọn)"></label>
      </div>
      <label class="file"><input type="checkbox" id="tHot" style="width:auto"> Ưu tiên cao</label>
      <div><label class="file">Thêm ảnh (tối đa 5, có thể dán bằng Ctrl+V): <input type="file" id="tFile" accept="image/*" multiple style="border:0;padding:4px 0;background:none"></label><div class="thumbs" id="tThumbs"></div></div>
      <div class="row">
        <button class="btn" id="tSave">Thêm việc</button>
        <button class="btn ghost" id="tCancel" hidden>Hủy sửa</button>
      </div>
      <div style="text-align:right;margin-top:-2px"><button type="button" class="btn ghost" id="tClear" style="padding:5px 12px;font-size:13px;min-width:0">Xóa nội dung</button></div>
    </div>
    <div class="filters">
      <button class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button class="chip" data-f="todo" aria-pressed="false">Chưa làm</button>
      <button class="chip" data-f="plan" aria-pressed="false">Ưu tiên làm</button>
      <button class="chip" data-f="done" aria-pressed="false">Đã xong</button>
      <input id="q" type="search" placeholder="Tìm việc..." aria-label="Tìm việc">
    </div>
    <div id="list"></div>
  </section>

  <section id="v-goals" hidden>
    <div class="row" style="align-items:center;margin-bottom:4px">
      <div class="file" style="flex:3">Điều bạn đang hướng tới, chia theo ngắn, trung và dài hạn.</div>
      <button class="btn" id="gAdd" style="flex:none;min-width:0">+ Thêm mục tiêu</button>
    </div>
    <div id="goalList"></div>
  </section>

  <section id="v-logs" hidden>
    <div class="form">
      <div class="compose">
        <input id="lTitle" placeholder="Tiêu đề" maxlength="150" aria-label="Tiêu đề nhật ký">

        if(sy.fontWeight)s2.b=fw(sy.fontWeight);

        if(sy.fontStyle)s2.i=sy.fontStyle==="italic"||sy.fontStyle==="oblique";

  function parseTime(x){

    if(mm){x=mm[1];if(/^(chiều|chieu|tối|toi|trưa|trua|pm|p)$/.test(mm[2]))pm=true;else am=true}
    x=x.replace(/[hg\.]/g,":").replace(/\s+/g,"");
    if(!x||x===":")return "";

    if(/^\d+$/.test(x)){
      if(x.length<=2){h=+x;mi=0}else if(x.length===3){h=+x[0];mi=+x.slice(1)}else if(x.length===4){h=+x.slice(0,2);mi=+x.slice(2)}else return null;

      h=+m[1];mi=m[2]===undefined?0:+m[2];

  $("period").onclick=function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.dataset.p){S.mode=b.dataset.p;S.off=0}
    else if(b.dataset.nav)S.off+=+b.dataset.nav;
    else return;
    renderAll();
  };
  $("lq").oninput=function(){S.lq=this.value;renderLogs()};
  $("q").oninput=function(){S.q=this.value;renderTasks()};

  document.querySelectorAll(".tab").forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected",x===b)});
      $("v-tasks").hidden=b.dataset.view!=="tasks";
      $("v-logs").hidden=b.dataset.view!=="logs";
      $("v-goals").hidden=b.dataset.view!=="goals";
      $("period").hidden=b.dataset.view==="goals";
      $("gfilter").hidden=b.dataset.view!=="goals";
      setupClamp();
      if(b.dataset.view==="goals"){
        var nw=Date.now(),chg=false;
        S.goals.forEach(function(g){if(g.status==="active"&&(!g.reviewed||nw-g.reviewed>864e5)){g.reviewed=nw;chg=true}});
        if(chg){save();renderRemind()}
      }
    };
  });

  $("lSave").onclick=function(){
    var text=$("lText").value.trim(),title=$("lTitle").value.trim();
    if(!text&&!title&&!S.limgs.length){$("lTitle").focus();return}
    S.logs.push({id:uid(),created:Date.now(),date:$("lDate").value||TODAY,title:title,text:text,rich:true,imgs:S.limgs.slice()});
    dropDraft("newlog");$("lTitle").value="";$("lText").value="";S.limgs=[];$("lThumbs").innerHTML="";$("lFile").value="";save();renderLogs();
  };
  $("logList").onclick=function(e){
    if(e.target.dataset.z){zoom(e.target.src);return}
    var lg=e.target.closest(".log");
    if(e.target.dataset.act==="editlog"&&lg){var L=S.logs.find(function(x){return x.id===lg.dataset.id});if(L)openLogEdit(L);return}
    if(e.target.dataset.act!=="dellog")return;
    var id=lg.dataset.id;
    confirmDel("Bạn có chắc muốn xóa nhật ký này?",function(){S.logs=S.logs.filter(function(x){return x.id!==id});save();renderLogs()});
  };

  /* Sao lưu / khôi phục bằng cách sao chép văn bản */
  $("backup").onclick=function(){
    var withImgs=JSON.stringify({tasks:S.tasks,logs:S.logs,goals:S.goals});
    var o=dialog('<b>Sao lưu &amp; khôi phục</b><div class="file">Sao chép đoạn văn bản dưới đây và lưu vào ghi chú/email của bạn. Để khôi phục, dán lại nội dung đã sao lưu vào ô này rồi bấm Khôi phục (sẽ thay thế dữ liệu hiện tại).</div><textarea id="bk"></textarea><div class="msg" id="bkm"></div>',
      [["Đóng"],["Sao chép","ghost"],["Khôi phục","danger"]],function(i,o){
        var ta=o.querySelector("#bk");
        if(i===1){ta.select();try{document.execCommand("copy");o.querySelector("#bkm").style.color="var(--acc)";o.querySelector("#bkm").textContent="Đã sao chép."}catch(e){}return true}
        if(i===2){try{var d=JSON.parse(ta.value);if(!Array.isArray(d.tasks)||!Array.isArray(d.logs))throw 0;S.tasks=d.tasks;S.logs=d.logs;S.goals=Array.isArray(d.goals)?d.goals:[];save();renderAll();return false}catch(e){o.querySelector("#bkm").style.color="var(--bad)";o.querySelector("#bkm").textContent="Nội dung không hợp lệ.";return true}}
      });
    o.querySelector("#bk").value=withImgs;
  };

  $("theme").onclick=function(){
    var r=document.documentElement,next=r.dataset.theme==="dark"?"light":"dark";
    r.dataset.theme=next;try{localStorage.setItem("nhatky-theme",next)}catch(e){}
  };

  var days=["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];
  $("today").textContent=days[new Date().getDay()]+", "+fmt(TODAY);
  $("lDate").value=TODAY;
  function ntDraft(){
    var v={title:$("tTitle").value,note:$("tNote").value,status:$("tStatus").value,due:$("tDue").value,time:$("tTime").value,hot:$("tHot").checked};
    if(!v.title&&!v.note&&!v.due&&!v.time&&!v.hot&&v.status==="todo")dropDraft("newtask");else putDraft("newtask",v);
  }
  $("taskForm").addEventListener("input",ntDraft);$("taskForm").addEventListener("change",ntDraft);
  function nlDraft(){
    var v={title:$("lTitle").value,text:$("lText").value,date:$("lDate").value,rich:true};
    if(!v.title&&!v.text)dropDraft("newlog");else putDraft("newlog",v);
  }
  ["lTitle","lText","lDate"].forEach(function(i){$(i).addEventListener("input",nlDraft)});
  if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});
  function toast(msg,undo){
    var old=document.querySelector(".toast");if(old)old.remove();
    var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");
    t.innerHTML='<span></span><button type="button" class="link">Hoàn tác</button>';t.firstChild.textContent=msg;
    document.body.appendChild(t);
    var tm=setTimeout(function(){t.remove()},7000);
    t.querySelector("button").onclick=function(){clearTimeout(tm);t.remove();undo()};
  }
  $("tClear").onclick=function(){
    var sn={title:$("tTitle").value,note:$("tNote").value,status:$("tStatus").value,due:$("tDue").value,time:$("tTime").value,goal:$("tGoal").value,hot:$("tHot").checked,imgs:S.timgs.slice()};
    if(!sn.title&&!sn.note&&!sn.due&&!sn.time&&!sn.goal&&!sn.hot&&sn.status==="todo"&&!sn.imgs.length)return;
    resetForm();
    toast("Đã xóa nội dung công việc đang nhập",function(){
      $("tTitle").value=sn.title;$("tNote").value=sn.note;$("tStatus").value=sn.status;$("tDue").value=sn.due;setTimeSel($("tTime"),sn.time);$("tGoal").value=sn.goal;$("tHot").checked=sn.hot;
      S.timgs=sn.imgs;$("tThumbs").innerHTML=thumbs(S.timgs,true);ntDraft();
    });
  };
  $("lClear").onclick=function(){
    var sn={title:$("lTitle").value,text:$("lText").value,date:$("lDate").value,imgs:S.limgs.slice()};
    if(!sn.title&&!sn.text&&!sn.imgs.length)return;
    $("lTitle").value="";$("lText").value="";$("lDate").value=TODAY;S.limgs=[];$("lThumbs").innerHTML="";$("lFile").value="";dropDraft("newlog");
    toast("Đã xóa nội dung nhật ký đang nhập",function(){
      $("lTitle").value=sn.title;$("lText").value=sn.text;$("lDate").value=sn.date||TODAY;S.limgs=sn.imgs;$("lThumbs").innerHTML=thumbs(S.limgs,true);nlDraft();
    });
  };
  /* Vuốt xuống để làm mới (điện thoại) */
  (function(){
    if(!("ontouchstart" in window))return;
    var box=document.createElement("div");box.id="ptr";box.setAttribute("aria-hidden","true");
    box.innerHTML='<div class="pill"></div>';document.body.appendChild(box);
    var pill=box.firstChild,sy=0,d=0,armed=false,pulling=false,TH=60;
    function blocked(t){return document.querySelector(".ov:not([hidden])")||document.body.style.overflow==="hidden"||(t.closest&&t.closest("input,textarea,select,[contenteditable],.tb"))}
    function show(v){
      box.classList.remove("snap");
      pill.style.transform="translateY("+(v-50)+"px)";pill.style.opacity=Math.min(1,v/40);
      pill.textContent=v>=TH?"Thả để làm mới":"Kéo xuống để làm mới";
    }
    function hide(){box.classList.add("snap");pill.style.transform="translateY(-60px)";pill.style.opacity=0}
    window.addEventListener("touchstart",function(e){
      armed=e.touches.length===1&&window.scrollY<=0&&!blocked(e.target);pulling=false;d=0;sy=armed?e.touches[0].clientY:0;
    },{passive:true});
    window.addEventListener("touchmove",function(e){
      if(!armed)return;
      var dy=e.touches[0].clientY-sy;
      if(!pulling){if(dy>10&&window.scrollY<=0)pulling=true;else{if(dy<-10)armed=false;return}}
      e.preventDefault();d=Math.min(dy*0.5,100);show(d);
    },{passive:false});
    function end(){
      if(!armed||!pulling){armed=false;return}
      armed=false;pulling=false;
      if(d>=TH){
        pill.textContent="Đang làm mới…";pill.style.transform="translateY(10px)";pill.style.opacity=1;
        setTimeout(function(){location.reload()},250);
      }else hide();
    }
    window.addEventListener("touchend",end,{passive:true});
    window.addEventListener("touchcancel",function(){armed=false;if(pulling){pulling=false;hide()}},{passive:true});
  })();
  var _rt=renderTasks,_rl=renderLogs,_rg=renderGoals;
  renderTasks=function(){_rt.apply(this,arguments);setupClamp()};
  renderLogs=function(){_rl.apply(this,arguments);setupClamp()};
  renderGoals=function(){_rg.apply(this,arguments);setupClamp()};
  $("remind").onclick=function(e){
    var b=e.target.closest("button[data-go]");if(!b)return;var go=b.dataset.go;
    if(go==="tasks"){S.mode="all";S.off=0;renderAll()}
    document.querySelector('.tab[data-view="'+go+'"]').click();
    window.scrollTo({top:0,behavior:"smooth"});
  };
  setInterval(renderRemind,60000);
  timeBox($("tTime"));
  makeRT($("lText"));
  try{document.execCommand("defaultParagraphSeparator",false,"div")}catch(e){}
  applyNewDrafts();
  load();renderAll();connect();
  document.addEventListener("visibilitychange",function(){if(!document.hidden){$("today").textContent=days[new Date().getDay()]+", "+fmt(iso(new Date()));renderAll()}});
})();
</script>
</body>
</html>
